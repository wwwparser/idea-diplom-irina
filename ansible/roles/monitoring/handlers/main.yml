---
- name: Validate nginx frontend
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Restart monitoring

- name: Restart native monitoring services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: [zabbix-server, php8.1-fpm, nginx]
  listen: Restart monitoring
