---
- name: Install matching Filebeat
  ansible.builtin.apt:
    name: "filebeat={{ elastic_version }}"
    state: present

- name: Configure Filebeat filestream inputs
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: '0600'
    validate: /usr/share/filebeat/bin/filebeat test config -c %s --path.home /usr/share/filebeat
  no_log: true
  notify: Restart Filebeat

- name: Enable Filebeat
  ansible.builtin.systemd_service:
    name: filebeat
    enabled: true
    state: started
